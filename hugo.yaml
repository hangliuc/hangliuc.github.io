baseurl: https://hangliuc.github.io/
languageCode: en-us
theme: hugo-theme-stack
title: HangOps | SRE
buildFuture: true 
copyright: Example Person
outputs:
    home:
        - HTML
        - RSS
        - Sitemap

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh-cn

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

languages:
    zh-cn:
        languageName: 中文
        title:  Hang
        weight: 1
        params:
            comments:
                waline:
                    locale:
                        admin: 站长
                        placeholder: "欢迎留下宝贵的评论！请留下正确的邮箱以便有回复时进行邮箱提醒，请勿发布任何与本文章无关的内容。"
                        sofa: 还没有人评论哦！快来抢沙发吧~
            sidebar:
                subtitle: 有建议和问题，欢迎评论或者直接联系我
    en:
        languageName: English
        title: Hang
        weight: 1
        params:
            comments:
                waline:
                    locale:
                        admin: Admin
                        placeholder: "Welcome to leave your valuable comments! Please leave the correct email address for email reminder when there is a reply. Do not post any content unrelated to this article."
                        sofa: No comments yet. Be the first to comment!
            sidebar:
                subtitle: If you have any suggestions or questions, feel free to leave a comment or contact me directly
        menu:
          main: 
            - identifier: home
              name: home
              url: /en
              weight: 1
              params:
                    icon: home
            - identifier: search
              name: search
              url: /en/search/
              weight: 2
              params:
                    icon: search
            
        # ar:
            - identifier: archives
              name: archives
              url: /en/archives/
              weight: 2
              params:
                    icon: archive
            
            - identifier: about
              name: about
              url: /en/about/
              weight: 3
              params:
                    icon: user
        # ar:
    #     languageName: عربي
    #     languagedirection: rtl
    #     title: موقع تجريبي
    #     weight: 3
    #     params:
    #         sidebar:
    #             subtitle: وصف تجريبي

# services:
#     # Change it to your Disqus shortname before using
#     disqus:
#         shortname: "hugo-theme-stack"
    # GA Tracking ID
    # googleAnalytics:
    #     id: G-4ZCZRY28LY
googleAnalytics: G-4ZCZRY28LY

pagination:
    pagerSize: 10

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    description: "专注 SRE 运维技术分享，涵盖 Kubernetes, Docker, Go, AWS 云原生架构实战与踩坑记录。"
    mainSections:
        - post
        - ops
        - topic

    featuredImageField: image
    rssFullContent: true
    favicon: /img/favicon.ico # e.g.: favicon placed in `static/favicon.ico` of your site folder, then set this field to `/favicon.ico` (`/` is necessary)

    footer:
        since: 2025
        customText: |
            <br>
            Powered by <a href="https://gohugo.io" target="_blank" rel="noopener">Hugo</a> |
            Theme by <a href="https://stack.jimmycai.com" target="_blank" rel="noopener">Stack</a>
            <br>
            Deployed with <strong>GitHub Actions</strong> 🚀

    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    sidebar:
        emoji: 🍌
        subtitle: "SRE 运维 / 云原生 / Go"
        avatar:
            enabled: true
            local: true
            src: img/head_portrait.jpg # 头像大小建议 150x150px
    search:
        enabled: true
        type: local

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: true
        provider: giscus

        disqusjs:
            shortname:
            apiUrl:
            apiKey:
            admin:
            adminLabel:

        utterances:
            repo:
            issueTerm: pathname
            label:

        beaudar:
            repo:
            issueTerm: pathname
            label:
            theme:

        remark42:
            host:
            site:
            locale:

        vssue:
            platform:
            owner:
            repo:
            clientId:
            clientSecret:
            autoCreateIssue: false

        # Waline client configuration see: https://waline.js.org/en/reference/component.html
            # locale:
            #     admin: 站长
            #     placeholder: "欢迎留下宝贵的评论！请留下正确的邮箱以便有回复时进行邮箱提醒，请勿发布任何与本文章无关的内容。"
            #     sofa: 还没有人评论哦！快来抢沙发吧~
            #     reactionTitle: 这篇文章对你有帮助吗？

        twikoo:
            envId:
            region:
            path:
            lang:

        # See https://cactus.chat/docs/reference/web-client/#configuration for description of the various options
        cactus:
            defaultHomeserverUrl: "https://matrix.cactus.chat:8448"
            serverName: "cactus.chat"
            siteName: "" # You must insert a unique identifier here matching the one you registered (See https://cactus.chat/docs/getting-started/quick-start/#register-your-site)

        giscus:
            repo: hangliuc/hangliuc.github.io
            repoID: "R_kgDOQdVGlg"
            category: "Announcements"
            categoryID: "DIC_kwDOQdVGls4CzJNq"
            mapping: pathname
            lightTheme: light
            darkTheme: dark_dimmed
            reactionsEnabled: 1
            emitMetadata: 0

        gitalk:
            owner:
            admin:
            repo:
            clientID:
            clientSecret:
            proxy:

        cusdis:
            host:
            id:
    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: false
        content:
            enabled: false

### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main: 
        - identifier: home
          name: 主页
          url: /
          weight: 1
          params:
              icon: home

        # - identifier: ops
        #   name: 运维
        #   url: /ops/
        #   weight: 10
        #   params:
        #       icon: terminal-2
        
        - identifier: search
          name: 搜索
          url: /search/
          weight: 20
          params:
              icon: search
        # - identifier: topic
        #   name: 专题
        #   url: /topic/
        #   weight: 20
        #   params:
        #       icon: scale-outline

        - identifier: archives
          name: 文章
          url: /archives/
          weight: 30
          params:
              icon: archive
        
        - identifier: about
          name: 关于
          url: /about/
          weight: 40
          params:
              icon: user

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/hangliuc
          params:
              icon: brand-github

        - identifier: email
          name: Email
          url: mailto:iliuhang@163.com
          params:
              icon: mail

        # - identifier: twitter
        #   name: Twitter
        #   url: https://twitter.com
        #   params:
        #       icon: brand-twitter


related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
